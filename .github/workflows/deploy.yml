name: Deploy

# Publishes docs.consequential.io on every merge to main.
#
# Before this existed, merging a PR changed nothing publicly — the site only moved
# when someone remembered to run `npm run build && wrangler deploy` by hand, so
# "merged" and "live" were independent facts and PRs sat merged-but-unpublished.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN (see README → Deploy).

on:
  push:
    branches: [main]
    # Skip the run when nothing that reaches the site changed.
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - '.github/**'
  workflow_dispatch: # manual re-run, e.g. after rotating the token

# Never let two deploys race; queue instead of cancelling, so an in-flight
# upload is not killed half-way through replacing the asset set.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # matches the version verified in CLAUDE.md
          cache: npm

      - run: npm ci

      # `npm run test` runs the build first, then the markdown-twin contract
      # tests against dist/ — so this both produces the artifact and gates it.
      - name: Build and test
        run: npm run test

      # Invoked directly rather than via cloudflare/wrangler-action. The action
      # bootstraps wrangler with `npx`, which on the runner cannot install
      # non-interactively ("npx canceled due to missing packages and no YES
      # option"). It then continued with a wrangler that could not read
      # wrangler.jsonc, so it saw no `assets` config and failed with the
      # misleading "Missing entry-point". wrangler is a pinned devDependency
      # now, so `npm ci` above installs the exact version, and this is the same
      # command the README documents for deploying by hand.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '705a25199f79333ff0e4db56e2078036'
