  # ───────────────────────── Invitations ─────────────────────────
  /invitations/verify:
    post:
      tags: [Invitations]
      summary: Verify an invitation token (and complete signup for new users)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                firstName: { type: string, description: "Required only when accepting as a brand-new user" }
                lastName: { type: string }
                password: { type: string }
      responses:
        "200": { description: Session created, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /invitations/check-email:
    post:
      tags: [Invitations]
      summary: Check the email associated with an invitation token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: Email info, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /invitations:
    get:
      tags: [Invitations]
      summary: List invitations for a context (Owner/Admin/Manager)
      parameters:
        - name: contextType
          in: query
          required: true
          schema: { type: string, enum: [TENANT, AGENCY, STORE] }
        - name: contextId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200": { description: Invitations, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    post:
      tags: [Invitations]
      summary: Create an invitation (Owner/Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, contextType, contextId, role]
              properties:
                email: { type: string, format: email }
                contextType: { type: string, enum: [TENANT, AGENCY, STORE] }
                contextId: { type: string, format: uuid }
                role: { type: string }
      responses:
        "201": { description: Invitation created, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /invitations/pending:
    get:
      tags: [Invitations]
      summary: List the current user's pending invitations
      responses:
        "200": { description: Pending invitations, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /invitations/batch:
    post:
      tags: [Invitations]
      summary: Create multiple invitations at once (Owner/Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitations, contextType, contextId]
              properties:
                invitations:
                  type: array
                  items:
                    type: object
                    properties: { email: { type: string, format: email }, role: { type: string } }
                contextType: { type: string, enum: [TENANT, AGENCY, STORE] }
                contextId: { type: string, format: uuid }
      responses:
        "201": { description: Invitations created, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /invitations/decline:
    post:
      tags: [Invitations]
      summary: Decline an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: Declined, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /invitations/{invitationId}:
    delete:
      tags: [Invitations]
      summary: Revoke an invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }

  # ───────────────────────── Shopify Connect ─────────────────────────
  /connect/shopify/install:
    get:
      tags: [Shopify Connect]
      summary: Begin the Shopify OAuth install flow
      parameters:
        - name: shop
          in: query
          required: true
          schema: { type: string }
        - name: storeId
          in: query
          required: true
          schema: { type: string }
        - name: returnTo
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorize URL to redirect the merchant to (also sets a shopify_oauth_nonce cookie)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { type: object, properties: { authorizeUrl: { type: string } } } }
        "400": { description: "NO_TENANT_CONTEXT / INVALID_SHOP", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "404": { description: STORE_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /connect/shopify/callback:
    get:
      tags: [Shopify Connect]
      summary: Shopify OAuth callback (public — cross-site redirect, no session cookie)
      security: []
      description: Identity is derived from the signed `state` query param and the nonce cookie, not from a session.
      responses:
        "302":
          description: "Redirects to {CLIENT_URL}{returnTo}?connected=shopify on success, or ?error={reason} on failure"

  # ───────────────────────── Supermetrics Connect ─────────────────────────
  /connect/supermetrics/login-link:
    post:
      tags: [Supermetrics Connect]
      summary: Create a Supermetrics login-link (popup OAuth) for an ad/analytics provider
      description: Requires tenant OWNER/ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, storeId]
              properties:
                provider: { type: string, enum: [facebook_ads, google_ads, ga4, tiktok_ads, klaviyo] }
                storeId: { type: string, format: uuid }
      responses:
        "200": { description: Login link created, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "404": { description: SUPERMETRICS_STORE_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { description: SUPERMETRICS_CONNECT_DISABLED, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "502": { description: SUPERMETRICS_UPSTREAM_ERROR, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /connect/supermetrics/finalize:
    post:
      tags: [Supermetrics Connect]
      summary: Finalize a Supermetrics connection after the popup returns
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [stateToken], properties: { stateToken: { type: string } } }
      responses:
        "200": { description: Connection finalized, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /connect/supermetrics/accounts:
    get:
      tags: [Supermetrics Connect]
      summary: List available accounts for a provider
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string, enum: [facebook_ads, google_ads, ga4, tiktok_ads, klaviyo] }
        - name: storeId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Accounts, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    post:
      tags: [Supermetrics Connect]
      summary: Save the selected accounts for a provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, storeId, accounts]
              properties:
                provider: { type: string, enum: [facebook_ads, google_ads, ga4, tiktok_ads, klaviyo] }
                storeId: { type: string, format: uuid }
                accounts:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties: { id: { type: string }, name: { type: string, maxLength: 255 } }
      responses:
        "200": { description: Saved selection, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }

