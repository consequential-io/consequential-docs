        "200": { description: Tenant, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /tenants/identifier/{identifier}:
    get:
      tags: [Tenants]
      summary: Resolve a tenant by its identifier
      parameters:
        - name: identifier
          in: path
          required: true
          schema: { type: string, maxLength: 100 }
