openapi: 3.1.0
info:
  title: Consequential API
  version: "1.0.0"
  summary: Consequential's REST API — analytics, acquisition, tenant/store management, billing, and integrations.
  description: |
    This is Consequential's REST API, served by the `core` service. All endpoints
    are mounted under `/api/v1`.

    **Authentication**: most endpoints require a Bearer JWT (obtained via
    `/auth/login`, `/auth/magic-link/verify`, or an OAuth provider). Tenant-scoped
    resources additionally require either an `X-Tenant-ID` header or a `:tenantId`
    path parameter — this varies by domain and is noted on each endpoint.

    **Response envelope**: nearly every endpoint wraps its response in a standard
    envelope (see `SuccessEnvelope` / `ErrorEnvelope` below):

    ```json
    { "success": true, "statusCode": 200, "message": "...", "data": { }, "meta": { "timestamp": "..." } }
    { "success": false, "message": "...", "code": "SOME_ERROR_CODE", "statusCode": 400, "errors": { }, "meta": { "timestamp": "...", "location": "..." } }
    ```

    There are two exceptions:
    - **OAuth** (`/oauth/*`): the MCP connector OAuth 2.1 Authorization Server
      surface returns raw RFC-shape JSON per RFC 6749/7591/8414, not this envelope.
    - **Partner Integrations** (`/partner/*`): authenticates with HTTP Basic
      auth (a partner client key/secret pair) instead of a Bearer JWT, and
      `GET /partner/data/acquisition/{view}` returns a differently-shaped
      envelope than the rest of the API.

    See each section for details.

    **What's intentionally excluded from this reference**:
    - Routes under `/internal/*` — these are HMAC-authenticated, service-to-service
      only, and explicitly not exposed via the public ingress. No external caller,
      including a customer's own integration, can ever reach them.
    - `GET /daily-reports/approve` — a human-facing HTML approval link sent to
      internal reviewer emails (security model: an unguessable UUIDv7 report ID,
      not a JSON API), not something an API integration would call.
  contact:
    name: Consequential support
    url: https://consequential.io/support
    email: support@consequential.io
servers:
  - url: https://app.consequential.io/api/v1
    description: Production
  - url: http://localhost:4040/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: |
      Three ways in: email/password (`/auth/login`), a passwordless magic
      link (`/auth/magic-link/request` then `/verify`), or Google OAuth
      (`/auth/google` → `/auth/google/callback`). All three return the same
      shape as `/auth/login` — an `accessToken` plus the user/tenant/store
      context — and pair with `/auth/refresh` to renew it and `/auth/logout`
      to end the session.

      New accounts start unverified: `/auth/register` sends a verification
      email, confirmed either by posting its token to `/auth/email/verify`
      or by following the emailed link straight to `/auth/verify-email`.
      `/auth/verify` is unrelated to that flow — it decodes an existing
      JWT's claims for inter-service use, not part of sign-in.

      Password reset (`/auth/password/forgot` → `verify-reset-token` →
      `reset`) and `/auth/email/resend-verification` return the same
      generic success response whether or not the email is registered, so
      as not to leak which addresses exist.
  - name: Signup
    description: |
      Self-serve tenant creation — `POST /signup` creates a new tenant
      *and* its owner user in one call, protected by Cloudflare Turnstile
      and rate limiting. Distinct from `/auth/register`, which creates a
      user with no tenant. `check-identifier` lets a signup form validate
      a company-name slug before submitting, and `resend-verification`
      follows the same anti-enumeration pattern as the equivalent `Auth`
      endpoints.
  - name: OAuth
    description: MCP connector OAuth 2.1 Authorization Server. Raw RFC JSON, not the standard envelope.
  - name: Profile
    description: |
      The caller's own account — distinct from `Users` (admin-facing
      lookups of *other* people) and `Tenant Settings` (tenant-wide, not
      personal). Covers profile fields, avatar upload, preferences
      (theme/timezone/language/notifications), active refresh-token
      sessions (list and revoke individually), and linked OAuth provider
      connections.
  - name: Invitations
    description: |
      Invite someone into a `TENANT`, `AGENCY`, or `STORE` context — the
      `contextType`/`contextId` pair on `GET /invitations` selects which.
      Two invite-acceptance entrypoints exist because the invitee may not
      have an account yet: `verify` checks the token and completes
      signup for a new user, while `accept`/`decline` are for an
      existing, authenticated user responding to an invite they can see
      under `/invitations/pending`.
  - name: Shopify Connect
    description: |
      OAuth install flow for connecting a Shopify store: `install`
      starts it, `callback` completes it. `callback` is intentionally
      unauthenticated — it's a cross-site redirect from Shopify, arriving
      with no session cookie to check.
  - name: Supermetrics Connect
    description: |
      Popup-based OAuth for ad/analytics providers, brokered through
      Supermetrics rather than talking to each provider directly:
      `login-link` opens the popup, `finalize` completes the connection
      once it returns, and `accounts` lists then saves which of the
      provider's accounts to sync.
  - name: Billing
    description: |
      Stripe-backed subscription management: browse `plans`/`addons`,
      read the tenant's current `subscription` and `entitlements`
      (Owner/Admin only), and change plan via `subscribe`/`upgrade` or
      an addon via its own `subscribe`/`cancel` (all Owner-only,
      `subscribe` also rate-limited). `POST /billing/webhook` is the
      Stripe event receiver — unauthenticated like any webhook, but
      signature-verified internally against the raw request body.
  - name: Tenants
    description: |
      The core multi-tenant resource. Beyond CRUD and resolving a tenant
      by its `identifier`, this covers tenant membership (`users`
      sub-routes: list/add/remove/change role) and `switch`, which
      changes the caller's *active* tenant context for subsequent
      requests — the same pattern `Stores`' own `switch` uses one level
      down.
  - name: Tenant Settings
    description: |
      Per-tenant configuration, all Owner/Admin-gated: profile,
      branding, brand guidelines, default metrics-comparison preference,
      and the Acquisition Dashboard's own settings — attribution/
      profitability inputs (`acquisition`), grading rules (`grading`),
      and performance `badges`. `grading/status` reports whether the
      grading baseline has finished computing, since that's an async
      job, not immediate.
  - name: Tenant Integrations
    description: |
      The tenant's datasource catalog — which providers exist and their
      current connection state — plus disconnecting one. Connecting a
      new datasource happens through the provider-specific
      `Shopify Connect`/`Supermetrics Connect` flows, not here; this tag
      is read-and-remove only.
  - name: Stores
    description: |
      A tenant's stores: CRUD, identifier lookup and availability check,
      marking one as the tenant's default, and `switch` — changes the
      caller's active store context, mirroring `Tenants`' own `switch`.
  - name: Users
    description: |
      Admin-facing user directory — look up *other* people by ID, email,
      or username, list, create, or soft-delete them (mostly Admin/Owner
      only). For the caller's own account, see `Profile` instead;
      `GET /users/me` is the one endpoint here that's about the caller.
  - name: Consents
    description: |
      The current user's consent state for privacy policy, terms of
      service, marketing, cookies, and data processing — read all of
      them at once via `GET /consents`, update one at a time via its own
      `PUT`.
  - name: Agencies
    description: |
      Agencies managing multiple tenants on their clients' behalf — a
      third context type alongside `Tenant` and `Store` (see the
      `contextType` enum on `Invitations`). CRUD; deletion is soft
      (Owner only).
  - name: Admin
    description: Platform staff only (platform-level OWNER/ADMIN role) — not usable by ordinary customers.
  - name: Acquisition
    description: Backs the Acquisition Dashboard (Channels/Campaigns/Ad sets/Creatives/Pages).
  - name: Attribution
    description: |
      Four dashboard cards answering "what's driving results, and by
      which model": `funnel`, `spend` by source, `touchpoints` (grouped
      by source type and name), and `sales-impact` (grouped by
      attribution model). Sibling to `Acquisition` and `Conversion` —
      this tag is the attribution-model-aware slice of the same
      underlying data.
  - name: Conversion
    description: |
      The purchase funnel — impressions → clicks → orders — with spend,
      revenue, CTR, CVR, ROAS, and CPA at each stage (`funnel`), plus a
      sortable, paginated `breakdown` by any dimension. Complements
      `Attribution`'s model-driven view with a straightforward
      stage-by-stage one.
  - name: Lens
    description: An older analytics surface with a different attribution-model vocabulary than Acquisition/Attribution/Conversion (first_touch/last_touch/linear/time_decay/position_based vs. last_click/first_click). Confirm with the Consequential team whether this is still actively maintained before integrating against it.
  - name: Metrics
    description: |
      The generic metric layer underneath the dashboards: `definitions`
      is the full catalog that every metric slug elsewhere in the API
      refers back to, `query` evaluates one over a period, and `kpis`
      returns a KPI summary row. `layout/tenant` persists how a tenant
      has arranged their metrics page (Owner/Admin to save, anyone to
      read).
  - name: Metric Alerts
    description: |
      Threshold alerts on top of `Metrics` — create/list/update/delete
      an alert, get a summary of alert counts, and pull one alert's
      fired-event history to see when it tripped and why.
  - name: Chat
    description: |
      The in-product AI assistant. `POST /chat/messages` streams its
      reply as Server-Sent Events rather than a JSON body — event types
      are `text-delta`, `tool-call`, `tool-result`, `render-block`,
      `done`, and `error`. The rest of the tag is ordinary conversation
      management: list, fetch, rename, or archive (soft-delete) a
      conversation.
  - name: Creative Feedback
    description: |
      The caller's own feedback on one ad creative within a tenant — get
      it, set it. Scoped to the current user, not a tenant-wide feedback
      log.
  - name: Onboarding
    description: |
      Tracks how far a tenant has gotten through setup. `GET /onboarding`
      and `/onboarding/progress` both read task-checklist progress;
      `complete-task`/`skip-task`/`current-step`/`reset` drive it
      manually, and `sync-progress` re-derives it from what's actually
      connected rather than trusting client-reported state.
      `detect-platform` — scanning a storefront URL — is the real
      backing endpoint for the "Connect your data" step. `connectors`
      returns tiered integration recommendations. `GET /onboarding/status`
      is a separate concept despite the shared mount: tenant-scoped
      provisioning/lifecycle state (current phase, phase history), not
      per-user checklist progress.
  - name: Reports
    description: The Daily Reports feature.
  - name: Partner Integrations
    description: |
      Server-to-server surface for embedded/partner platforms (e.g. Nector.io)
      to provision a merchant tenant and read its acquisition data on the
      merchant's behalf. Authenticates with `partnerBasicAuth` (a partner
      client key/secret pair, issued via `POST /partner/register`) rather
      than the Bearer JWT the rest of this API uses, and
      `GET /partner/data/acquisition/{view}` returns a different response
      envelope than every other endpoint — see that operation's description.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    partnerBasicAuth:
      type: http
      scheme: basic
      description: |
        `Authorization: Basic base64(client_key:client_secret)`. Credentials
        are issued once via `POST /partner/register` (platform admin only) —
        the secret is returned in that response and never recoverable again.
  parameters:
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: Tenant context for the request.
      schema:
        type: string
        format: uuid
    StoreIdHeaderOptional:
      name: X-Store-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    PeriodPreset:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [7d, 30d, 90d, mtd, ytd]
    FromDate:
      name: from
      in: query
      required: false
      description: ISO date (YYYY-MM-DD). Used together with `to` instead of `period`.
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
      required: [success, data]
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        code:
          type: string
        statusCode:
          type: integer
        errors:
          type: object
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            location:
              type: string
      required: [success, message, code, statusCode]
    PartnerErrorEnvelope:
      type: object
      description: |
        Every error under `/partner/*` nests its detail under `error`, rather than
        using the flat top-level `code`/`message` of `ErrorEnvelope`. The HTTP status
        is the same either way — only the body differs. Read `error.code`.
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            statusCode:
              type: integer
            errors:
              type: object
              description: Present on 422 VALIDATION_ERROR; the failing fields.
            meta:
              type: object
              properties:
                timestamp:
                  type: string
                  format: date-time
                location:
                  type: string
          required: [code, message]
      required: [success, error]
    AnalyticsEnvelope:
      type: object
      description: Response shape shared by Attribution and Conversion cards.
      properties:
        available:
          type: boolean
          description: False when the tenant doesn't have the required capability enabled (e.g. blotoutFunnelEnabled, ordersAvailable), or when model=platform is requested on a card with no platform-reported equivalent.
        data:
          type: object
          nullable: true
        meta:
          type: object
          properties:
            period:
              type: object
              properties:
                start: { type: string, format: date }
                end: { type: string, format: date }
            filters_applied:
              type: object
            generated_at:
              type: string
              format: date-time
            cache_hit:
              type: boolean
      required: [available]

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                rememberMe: { type: boolean }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { type: object }
                          tenant: { type: object, nullable: true }
                          store: { type: object, nullable: true }
                          stores: { type: array, items: { type: object } }
  /auth/email/verify:
    post:
      tags: [Auth]
      summary: Verify email with a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Email verification link (redirect-based)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "302": { description: Redirects to the plan picker on success, or /verify-email/error?reason= on failure }
  /auth/email/resend-verification:
    post:
      tags: [Auth]
      summary: Resend the verification email (rate-limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "200": { description: Generic response (anti-enumeration), content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request a password reset email (rate-limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "200": { description: Generic response, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/password/verify-reset-token:
    post:
      tags: [Auth]
      summary: Verify a password reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: Valid reset token, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password with a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties: { token: { type: string }, password: { type: string } }
      responses:
        "200": { description: Password reset, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/password/change:
    post:
      tags: [Auth]
      summary: Change password (authenticated, rate-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties: { currentPassword: { type: string }, newPassword: { type: string } }
      responses:
        "200": { description: Password changed, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/magic-link/request:
    post:
      tags: [Auth]
      summary: Request a magic sign-in link (rate-limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "200": { description: Generic response, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/magic-link/verify:
    post:
      tags: [Auth]
      summary: Verify a magic link token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200":
          description: Authenticated (same shape as /auth/login)
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an access token
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { refreshToken: { type: string, description: "May also be supplied via cookie." } } }
      responses:
        "200":
          description: New tokens issued
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (invalidates the current session)
      responses:
        "200": { description: Logged out, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/providers:
    get:
      tags: [Auth]
      summary: List enabled OAuth sign-in providers
      security: []
      responses:
        "200": { description: List of providers, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /auth/google:
    get:
      tags: [Auth]
      summary: Begin Google OAuth sign-in (redirect)
      security: []
      responses:
        "302": { description: Redirects to Google }
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback (redirect)
      security: []
      responses:
        "302": { description: Redirects back into the app with a session established }
  /auth/verify:
    post:
      tags: [Auth]
      summary: Verify a JWT and return its claims (inter-service use)
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { token: { type: string, description: "May also be supplied via Authorization: Bearer header." } } }
      responses:
        "200": { description: Decoded claims, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }

  # ───────────────────────── Signup ─────────────────────────
  /signup:
    post:
      tags: [Signup]
      summary: Self-serve signup (creates a new tenant + owner user)
      security: []
      description: Protected by Cloudflare Turnstile and rate-limited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Company + user signup fields (name, email, password, company name, etc.)" }
      responses:
        "201": { description: Tenant provisioned, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "409": { description: "EMAIL_TAKEN — email already registered", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /signup/check-identifier:
    get:
      tags: [Signup]
      summary: Check whether a company-name identifier is available
      security: []
      parameters:
        - name: companyName
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { type: object, properties: { available: { type: boolean } } } }
  /signup/resend-verification:
    post:
      tags: [Signup]
      summary: Resend signup verification (rate-limited, anti-enumeration)
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { email: { type: string, format: email } } }
      responses:
        "202": { description: "Always returns 202 regardless of whether the email exists", content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }

  # ───────────────────────── OAuth (MCP) ─────────────────────────
  /oauth/register:
    post:
      tags: [OAuth]
      summary: Dynamic Client Registration (RFC 7591)
      security: []
      description: Rate-limited. Returns raw RFC JSON, not the standard envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, redirect_uris]
              properties:
                client_name: { type: string, minLength: 1, maxLength: 255 }
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, maxLength: 512 }
      responses:
        "201":
          description: Client registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string }
                  client_name: { type: string }
                  redirect_uris: { type: array, items: { type: string } }
                  token_endpoint_auth_method: { type: string, enum: [none] }
                  grant_types: { type: array, items: { type: string } }
                  response_types: { type: array, items: { type: string } }
        "400":
          description: invalid_client_metadata / invalid_redirect_uri
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, error_description: { type: string } } }
  /oauth/authorize:
    get:
      tags: [OAuth]
      summary: Authorization endpoint (RFC 6749 + PKCE)
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string, minLength: 43, maxLength: 128 }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
        - name: scope
          in: query
          schema: { type: string, default: "mcp:read" }
        - name: resource
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirects to the consent screen (success) or to redirect_uri with ?error=... (tier-2 errors)
        "400":
          description: Unknown client_id/redirect_uri — never redirected, returned as raw JSON
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, error_description: { type: string } } }
  /oauth/authorize/decision:
    post:
      tags: [OAuth]
      summary: Approve or deny a consent request
      description: Requires a normal pulse session token (not an OAuth-issued token) — this one endpoint DOES use the standard envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, code_challenge, scope, resource, approved]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                code_challenge: { type: string }
                scope: { type: string }
                resource: { type: string }
                state: { type: string }
                approved: { type: boolean }
      responses:
        "200":
          description: Redirect URL to send the user's browser to
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { type: object, properties: { redirect: { type: string } } } }
        "403":
          description: FORBIDDEN_TOKEN_TYPE — an OAuth-issued token was used instead of a session token
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /oauth/token:
    post:
      tags: [OAuth]
      summary: Token endpoint (authorization_code or refresh_token grant)
      security: []
      description: Rate-limited. `application/x-www-form-urlencoded` body. Raw RFC JSON response, always sets Cache-Control:no-store.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string, description: "authorization_code grant only" }
                client_id: { type: string }
                redirect_uri: { type: string, description: "authorization_code grant only" }
                code_verifier: { type: string, description: "authorization_code grant only" }
                refresh_token: { type: string, description: "refresh_token grant only" }
      responses:
        "200":
          description: Token result
          content:
            application/json:
              schema: { type: object, properties: { access_token: { type: string }, refresh_token: { type: string }, token_type: { type: string }, expires_in: { type: integer } } }
        "400":
          description: invalid_grant / unsupported_grant_type
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, error_description: { type: string } } }

