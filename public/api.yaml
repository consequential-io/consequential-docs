  # ───────────────────────── Metrics ─────────────────────────
  /metrics/definitions:
    get:
      tags: [Metrics]
      summary: Get the full metric catalog
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/StoreIdHeaderOptional"
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                slug: { type: string }
                                name: { type: string }
                                description: { type: string }
                                category: { type: string }
                                pillar: { type: string }
                                pillarLabel: { type: string }
                                format: { type: string }
                                datasource: { type: string }
                                defaultGrain: { type: string }
                                supportedGrains: { type: array, items: { type: string } }
                                dimensions: { type: array, items: { type: string } }
                                displayOrder: { type: integer }
                                isActive: { type: boolean }
                                isDefaultKpi: { type: boolean }
                                hasTenantOverride: { type: boolean }
                                accent: { type: string }
                                aggregation: { type: string }
                          datasources: { type: array, items: { type: object, properties: { type: { type: string }, label: { type: string }, icon: { type: string }, subsources: { type: array } } } }
                          activeDatasources: { type: array, items: { type: string } }
                          metricCategories: { type: array }
                          metricPillars: { type: array }
                          dimensionCategories: { type: array }
                          funnels: { type: array }
                          dimensions: { type: array }
        "400": { description: TENANT_CONTEXT_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /metrics/definitions/{slug}:
    get:
      tags: [Metrics]
      summary: Get one metric's catalog entry
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Catalog entry, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "404": { description: METRIC_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /metrics/query:
    post:
      tags: [Metrics]
      summary: Query a metric's values
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/StoreIdHeaderOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, period]
              properties:
                slug: { type: string }
                period:
                  oneOf:
                    - type: object
                      properties: { preset: { type: string, enum: ["7d", "30d", "90d", mtd, ytd] } }
                    - type: object
                      properties: { from: { type: string, format: date }, to: { type: string, format: date } }
                grain: { type: string, enum: [hour, day, week, month, quarter] }
                dimensions: { type: array, items: { type: string } }
                compare: { type: string, enum: [previous_period, previous_year, previous_year_dow] }
                topN: { type: integer }
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      dimension: { type: string }
                      operator: { type: string, enum: [equals, notEquals, in, notIn, contains, notContains, gt, gte, lt, lte, set, notSet] }
                      values: { type: array, items: {} }
      responses:
        "200": { description: Query result, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { description: "INVALID_QUERY / INVALID_FILTER_OPERATOR / INVALID_FILTER_VALUES", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "502": { description: CUBE_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "503": { description: PREAGG_WARMING, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /metrics/kpis:
    get:
      tags: [Metrics]
      summary: Get the KPI summary row
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/StoreIdHeaderOptional"
        - name: period
          in: query
          schema: { type: string, enum: ["7d", "30d", "90d", mtd, ytd], default: "30d" }
      responses:
        "200": { description: KPIs, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { description: INVALID_PERIOD, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /metrics/layout/tenant:
    get:
      tags: [Metrics]
      summary: Get the tenant's saved metrics-page layout (Owner/Admin)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200": { description: Layout, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    put:
      tags: [Metrics]
      summary: Save the tenant's metrics-page layout (Owner/Admin)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }

  # ───────────────────────── Metric Alerts ─────────────────────────
  /metric-alerts:
    get:
      tags: [Metric Alerts]
      summary: List metric alerts
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200": { description: Alerts, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "503": { description: SEMANTICS_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    post:
      tags: [Metric Alerts]
      summary: Create a metric alert
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metricSlug, name, type, timeframe, config]
              properties:
                metricSlug: { type: string }
                name: { type: string }
                description: { type: string }
                type: { type: string, description: "AlertType enum — see semantics service." }
                timeframe: { type: string, description: "AlertTimeframe enum — see semantics service." }
                config: {}
                isActive: { type: boolean }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /metric-alerts/summary:
    get:
      tags: [Metric Alerts]
      summary: Get alert summary counts
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200": { description: Summary, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /metric-alerts/{id}:
    get:
      tags: [Metric Alerts]
      summary: Get an alert
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Alert, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    patch:
      tags: [Metric Alerts]
      summary: Update an alert
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                type: { type: string }
                timeframe: { type: string }
                config: {}
                isActive: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    delete:
      tags: [Metric Alerts]
      summary: Delete an alert
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /metric-alerts/{id}/events:
    get:
      tags: [Metric Alerts]
      summary: Get an alert's fired-event history
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Events, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }

  # ───────────────────────── Chat ─────────────────────────
  /chat/messages:
    post:
      tags: [Chat]
      summary: Send a chat message (SSE-streamed response)
      description: "Response is Server-Sent Events, not JSON. Event types: text-delta, tool-call, tool-result, render-block, done, error."
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                conversationId: { type: string, format: uuid }
                message: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string, description: "Stream of named SSE events; error event shape: {type: 'error', message: string}." }
        "401": { description: UNAUTHENTICATED, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /chat/conversations:
    get:
      tags: [Chat]
      summary: List conversations
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: Conversations, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /chat/conversations/{id}:
    get:
      tags: [Chat]
      summary: Get a conversation and its messages
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "{conversation, messages}", content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "404": { description: NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    patch:
      tags: [Chat]
      summary: Rename a conversation
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [title], properties: { title: { type: string, minLength: 1, maxLength: 120 } } }
      responses:
        "200": { description: "{ok: true}", content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    delete:
      tags: [Chat]
      summary: Archive (soft-delete) a conversation
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "{ok: true}", content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }

  # ───────────────────────── Creative Feedback ─────────────────────────
  /tenants/{tenantId}/creatives/{adId}/feedback:
    get:
      tags: [Creative Feedback]
      summary: Get the caller's feedback on a creative
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: adId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Sentiment (null if the user hasn't voted)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { type: object, properties: { sentiment: { type: string, enum: [up, down], nullable: true } } } }
        "401": { description: AUTHENTICATION_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    put:
      tags: [Creative Feedback]
      summary: Set the caller's feedback on a creative
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: adId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sentiment], properties: { sentiment: { type: string, enum: [up, down] } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "401": { description: AUTHENTICATION_REQUIRED, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  # ───────────────────────── Onboarding ─────────────────────────
  /onboarding:
    get:
      tags: [Onboarding]
      summary: Get the current user's onboarding status/progress
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/progress:
    get:
      tags: [Onboarding]
      summary: Get onboarding progress summary
      responses:
        "200": { description: Progress, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/complete-task:
    post:
      tags: [Onboarding]
      summary: Mark an onboarding task complete
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [taskKey], properties: { taskKey: { type: string }, metadata: {} } }
      responses:
        "200": { description: Marked complete, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/skip-task:
    post:
      tags: [Onboarding]
      summary: Skip an onboarding task
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [taskKey], properties: { taskKey: { type: string } } }
      responses:
        "200": { description: Skipped, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/sync-progress:
    post:
      tags: [Onboarding]
      summary: Re-detect and auto-complete tasks from current account state
      responses:
        "200": { description: Synced, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/current-step:
    patch:
      tags: [Onboarding]
      summary: Set the current onboarding step
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [step], properties: { step: { type: string } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/reset:
    post:
      tags: [Onboarding]
      summary: Reset onboarding progress
      responses:
        "200": { description: Reset, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/detect-platform:
    post:
      tags: [Onboarding]
      summary: Scan a storefront URL to detect connected platforms
      description: This is the real backing endpoint for the "Connect your data" onboarding scan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties: { url: { type: string, format: uri }, storeId: { type: string, format: uuid } }
      responses:
        "200": { description: Detected platforms, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/connectors:
    get:
      tags: [Onboarding]
      summary: Get tiered connector recommendations
      description: Backs the Necessary/Recommended/Good to have connector list.
      parameters:
        - name: storeId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Connector recommendations + gate verdict, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /onboarding/status:
    get:
      tags: [Onboarding]
      summary: Get tenant provisioning/lifecycle status
      description: Tenant-scoped (not user-scoped, despite sharing the /onboarding mount) — used by Pulse's self-serve provisioning screen. Returns lifecycle state, current in-flight phase, and phase history.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200": { description: Provisioning status, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }

  # ───────────────────────── Reports (Daily Reports) ─────────────────────────
  /tenants/{tenantId}/reports:
    get:
      tags: [Reports]
      summary: List recent daily reports
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Up to 30 most recent reports"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reports:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                reportDate: { type: string, format: date }
                                status: { type: string, enum: [pending, snapshotting, generating, ready, failed, no_baseline] }
                                generatedAt: { type: string, format: date-time, nullable: true }
                                model: { type: string, nullable: true }
                                costUsd: { type: number, nullable: true }
                                error: { type: string, nullable: true }
  /tenants/{tenantId}/reports/{date}:
    get:
      tags: [Reports]
      summary: Get one day's report
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          report:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              reportDate: { type: string, format: date }
                              status: { type: string, enum: [pending, snapshotting, generating, ready, failed, no_baseline] }
                              html: { type: string, nullable: true }
                              generatedAt: { type: string, format: date-time, nullable: true }
                              model: { type: string, nullable: true }
                              error: { type: string, nullable: true }
        "404": { description: DAILY_REPORT_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /tenants/{tenantId}/reports/{date}/regenerate:
    post:
      tags: [Reports]
      summary: Regenerate a report
      description: |
        **Not currently functional.** This endpoint is presently a hardcoded stub
        that always returns `503 DAILY_REPORT_REGENERATION_UNAVAILABLE` regardless
        of role or input — manual regeneration isn't wired up yet; reports are
        produced on a Cloud Tasks schedule. Documented here for completeness /
        forward-compatibility, not as a currently-working capability.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date, description: "YYYY-MM-DD, must be within the last 30 days." }
      responses:
        "400": { description: "DAILY_REPORT_BAD_DATE / DAILY_REPORT_DATE_OUT_OF_RANGE", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "503": { description: "DAILY_REPORT_REGENERATION_UNAVAILABLE — always returned currently", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  # ───────────────────────── Partner Integrations ─────────────────────────
  /partner/connect:
    post:
      tags: [Partner Integrations]
      summary: Connect a merchant (find-or-create tenant)
      description: |
        Finds or creates a Consequential tenant for the given shop and a user
        for the given email, grants that user an OWNER membership, and mints
        a 10-minute one-time connect token. Send the merchant's browser to
        `redirect_url` next — see `GET /partner/login`.

        Rate limits: 60 requests/minute and 1,000/hour per partner credential.
      security: [{ partnerBasicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shop_domain, tenant_name, email]
              properties:
                shop_domain: { type: string, example: "example-store.myshopify.com" }
                tenant_name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
      responses:
        "200":
          description: Connected (whether the tenant was just created or already existed)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token: { type: string, description: "Short-lived JWT, same value embedded in redirect_url." }
                          token_type: { type: string, enum: [Bearer] }
                          expires_in: { type: integer, enum: [600] }
                          tenant_id: { type: string, description: "Tenant's public identifier (not the internal UUID)." }
                          onboarding_status: { type: string, enum: [CREATED, ONBOARDING, ACTIVE], description: "CREATED: brand new tenant. ONBOARDING: exists but not yet data-ready. ACTIVE: ready to serve GET /partner/data." }
                          redirect_url: { type: string, format: uri, description: "Send the merchant's browser here to complete login." }
                          is_new_tenant: { type: boolean }
        "400": { description: INVALID_SHOP_DOMAIN, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "401": { description: "INVALID_CREDENTIALS — bad or missing partner Basic auth", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "403": { description: "EMAIL_CONFLICT — the email is already associated with a different tenant", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "409": { description: "SHOP_ALREADY_CONNECTED — this shop is already connected through a different partner integration", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "429": { description: RATE_LIMIT_EXCEEDED, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
  /partner/login:
    get:
      tags: [Partner Integrations]
      summary: Exchange a connect token for a real session
      description: |
        Public browser-navigation endpoint — the connect token itself is the
        auth, there's no partner Basic auth on this leg. Verifies the token,
        sets session cookies, and redirects into the product (`/home` if the
        merchant's workspace is already named, otherwise
        `/onboarding/workspace`). Not something a partner's backend calls
        directly — it's the destination of `connect`'s `redirect_url`, opened
        in the merchant's own browser.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirects into the product with session cookies set, or to `/login?error=...` (token_expired / invalid_token / user_not_found / tenant_not_found) on failure.
  /partner/data/acquisition/{view}:
    get:
      tags: [Partner Integrations]
      summary: Read acquisition data for a connected merchant
      description: |
        Composes over the same acquisition engine `GET /acquisition/{view}`
        uses, scoped to a tenant previously connected by this partner
        credential. **Returns a different envelope than the rest of this
        API** — `{ success, metadata, shapes }`, not `SuccessEnvelope` — to
        match the documented partner integration contract:
        `shapes` is always an array of exactly 4 objects, in this order:
        `timeseries_current`, `timeseries_previous`, `total_metrics`,
        `channel_breakdown`.

        **Fidelity note**: `channels` has full real daily fidelity. For
        `campaigns`/`ads`/`pages`, `total_metrics` is real but
        `timeseries_current`/`timeseries_previous`/`channel_breakdown` are
        currently returned empty (with a `metadata.note` explaining why) — a
        true daily-by-entity breakdown for those resources has cost/perf
        implications that aren't scoped yet.

        Rate limits: 60 requests/minute and 1,000/hour per partner credential.
      security: [{ partnerBasicAuth: [] }]
      parameters:
        - name: view
          in: path
          required: true
          schema: { type: string, enum: [channels, campaigns, ads, pages] }
        - name: shop_domain
          in: query
          required: true
          schema: { type: string, example: "example-store.myshopify.com" }
        - name: start_date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end_date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: currency
          in: query
          schema: { type: string }
        - name: timezone
          in: query
          schema: { type: string }
        - name: model
          in: query
          schema: { type: string, enum: [last_click, first_click, platform] }
      responses:
        "200":
          description: Shaped acquisition data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  metadata:
                    type: object
                    properties:
                      shape_format: { type: string, enum: [v2] }
                      bucket: { type: string, enum: [acquisition] }
                      resource: { type: string }
                      timestamp: { type: string, format: date-time }
                      tenant_id: { type: string }
                  shapes:
                    type: array
                    description: |
                      The shape set is specific to the requested view — it is not the same four
                      shapes for every resource. Match on `id` rather than array position or length.

                      - `channels`: timeseries_current, timeseries_previous, total_metrics, channel_breakdown
                      - `campaigns`: campaigns, total_metrics, performance_distribution, grade_distribution, match_rates, campaign_status_distribution
                      - `ads`: ads, total_metrics, performance_distribution, grade_distribution, match_rates
                      - `pages`: pages, total_metrics, performance_distribution, grade_distribution, match_rates

                      Only `channels` returns a daily timeseries and a channel breakdown.
                      `campaign_status_distribution` is campaigns-only and is always empty, with
                      an explanation in its `metadata.note`.
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [timeseries_current, timeseries_previous, total_metrics, channel_breakdown, campaigns, ads, pages, performance_distribution, grade_distribution, match_rates, campaign_status_distribution] }
                        type: { type: string, enum: [TimeSeries, PeriodComparison, EntityList, Distribution] }
                        purpose: { type: string, enum: [temporal_trend, aggregate_all, aggregate_by_dimension, raw_data] }
                        native: { type: boolean }
                        metadata: { type: object }
                        aggregation: { type: object }
                        data:
                          type: array
                          description: "TimeSeries shapes: rows of {date, channel, revenue, spend, orders, computedroas, platformroas, cac, ctr, conv, clicks, impressions}. PeriodComparison shapes: rows of {category, metrics: {<Metric Label>: {current, previous, change, accent}}}. EntityList shapes: the view's own entity rows. performance_distribution/grade_distribution: rows of {category, count, percentage}, zero-filled for every declared category. match_rates: one row per ad provider, with {ad_provider, match_rate, match_rate_via_id, match_rate_via_name, matched_orders, matched_via_id, matched_via_name, unmatched_orders, total_attributed_orders}."
                          items: { type: object }
        "400": { description: INVALID_SHOP_DOMAIN, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "401": { description: "INVALID_CREDENTIALS — bad or missing partner Basic auth", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "404": { description: "TENANT_NOT_FOUND (also returned if the shop belongs to a different partner) / RESOURCE_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "409": { description: "TENANT_NOT_ACTIVE — tenant setup isn't complete yet / TENANT_NO_MEMBERS — connected tenant has no active members to attribute the query to", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "429": { description: RATE_LIMIT_EXCEEDED, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "502": { description: CUBE_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "503": { description: "PREAGG_WARMING — pre-aggregations are still building", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
  /partner/register:
    post:
      tags: [Partner Integrations]
      summary: Issue a partner credential (platform admin only)
      description: |
        Mints a new `client_key`/`client_secret` pair for a partner. Doubles
        as rotation: registering again for a `partner_key` that already has
        an active credential revokes the old one first — there's no separate
        rotation endpoint. `client_secret` is returned once, here, and is not
        recoverable again.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, partner_key]
              properties:
                display_name: { type: string, maxLength: 255 }
                partner_key: { type: string, maxLength: 50, example: nector }
      responses:
        "201":
          description: Credential issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          client_key: { type: string, description: "64-character hex string." }
                          client_secret: { type: string, description: "96-character hex string. Store this now — it is never shown again." }
                          partner_key: { type: string }
                          display_name: { type: string }
        "401": { description: "Not authenticated", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
        "403": { description: "Not a platform OWNER/ADMIN", content: { application/json: { schema: { $ref: "#/components/schemas/PartnerErrorEnvelope" } } } }
