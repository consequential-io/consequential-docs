  # ───────────────────────── Stores ─────────────────────────
  /stores:
    get:
      tags: [Stores]
      summary: List stores
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { type: object, properties: { stores: { type: array, items: { type: object } } } } }
    post:
      tags: [Stores]
      summary: Create a store (tenant Owner/Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, name, currency, timezone, locale]
              properties:
                identifier: { type: string, pattern: "^[a-zA-Z0-9_-]+$", maxLength: 100 }
                name: { type: string, maxLength: 255 }
                description: { type: string, maxLength: 1000 }
                currency: { type: string, description: "3-letter ISO 4217, uppercase" }
                timezone: { type: string }
                locale: { type: string, description: "xx-XX format" }
                country: { type: string, description: "2-letter ISO" }
                region: { type: string }
                city: { type: string }
                address: { type: string }
                postalCode: { type: string }
                logo: { type: string, format: uri }
                favicon: { type: string, format: uri }
                primaryColor: { type: string }
                secondaryColor: { type: string }
                settings:
                  type: object
                  properties:
                    allowGuestCheckout: { type: boolean }
                    requireEmailVerification: { type: boolean }
                    allowReviews: { type: boolean }
                    businessHours: { type: object }
                    contactInfo: { type: object, properties: { email: { type: string }, phone: { type: string }, supportEmail: { type: string } } }
                    shippingZones: { type: array, items: { type: object } }
                    fulfillmentSettings: { type: object }
                    theme: { type: object }
                    seo: { type: object }
                    integrations: { type: object }
                active: { type: boolean }
                isDefault: { type: boolean }
                launchedAt: { type: string, format: date-time }
      responses:
        "201": { description: Store created, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { description: IDENTIFIER_EXISTS, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /stores/default:
    get:
      tags: [Stores]
      summary: Get the default store
      responses:
        "200": { description: Default store, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /stores/identifier/{identifier}:
    get:
      tags: [Stores]
      summary: Get a store by identifier
      parameters:
        - name: identifier
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Store, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "404": { description: STORE_NOT_FOUND, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /stores/check-identifier/{identifier}:
    get:
      tags: [Stores]
      summary: Check whether a store identifier is available
      parameters:
        - name: identifier
          in: path
          required: true
          schema: { type: string }
        - name: excludeStoreId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties: { data: { type: object, properties: { available: { type: boolean } } } }
  /stores/{storeId}:
    get:
      tags: [Stores]
      summary: Get a store by ID
      parameters:
        - name: storeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Store, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    put:
      tags: [Stores]
      summary: Update a store (tenant Owner/Admin)
      parameters:
        - name: storeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object, description: "Same fields as create, all optional, plus url." }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    delete:
      tags: [Stores]
      summary: Delete a store (tenant Owner/Admin)
      parameters:
        - name: storeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { description: "DEFAULT_STORE_DELETION — can't delete the default store while others exist", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
