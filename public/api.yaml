  # ───────────────────────── Acquisition ─────────────────────────
  /acquisition/filter-options:
    get:
      tags: [Acquisition]
      summary: Get filter dropdown options (ad providers, creative formats)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200": { description: Filter options, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
  /acquisition/{view}:
    get:
      tags: [Acquisition]
      summary: Get Acquisition Dashboard data for one tab
      description: Backs the Acquisition Dashboard's Channels/Campaigns/Ad sets/Creatives/Pages tabs.
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: view
          in: path
          required: true
          schema: { type: string, enum: [channels, campaigns, creatives, ad-sets, pages] }
        - $ref: "#/components/parameters/PeriodPreset"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - name: model
          in: query
          schema: { type: string, enum: [last_click, first_click, platform], default: last_click }
        - name: currency
          in: query
          schema: { type: string }
        - name: timezone
          in: query
          schema: { type: string }
        - name: stores
          in: query
          schema: { type: string, description: "Comma-separated store IDs." }
        - name: ad_providers
          in: query
          schema: { type: string, description: "Comma-separated." }
        - name: campaign_status
          in: query
          schema: { type: string, description: "Comma-separated. Applies to campaigns/ad-sets/creatives." }
        - name: ad_types
          in: query
          schema: { type: string, description: "Comma-separated." }
        - name: creative_formats
          in: query
          schema: { type: string, description: "Comma-separated. Ignored on the channels view." }
        - name: customer_types
          in: query
          schema: { type: string, description: "Comma-separated." }
        - name: campaign_id
          in: query
          schema: { type: string, description: "Parent-scoped filter, view-dependent." }
        - name: ad_set_id
          in: query
          schema: { type: string }
        - name: ad_id
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: string }
        - name: include_previous_period
          in: query
          schema: { type: boolean }
        - name: offset
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema: { type: string, example: "health_overall:desc" }
      responses:
        "200":
          description: View data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          shapes:
                            type: object
                            description: "One key matching the requested view (campaigns/creatives/ad-sets/pages/channels), containing the row array."
                          summary: { type: object, additionalProperties: { type: number } }
                          summary_previous: { type: object }
                          performance_distribution: { type: object }
                          grade_distribution: { type: object }
                          campaign_type_distribution: { type: object }
                          campaign_structure_distribution: { type: object }
                          actions: { type: array, items: { type: object } }
                          match_rates:
                            type: array
                            items:
                              type: object
                              properties:
                                ad_provider: { type: string }
                                match_rate: { type: number }
                                matched_orders: { type: integer }
                                total_attributed_orders: { type: integer }
                                matched_via_id: { type: integer }
                                matched_via_name: { type: integer }
                                unmatched_orders: { type: integer }
                      meta:
                        type: object
                        properties:
                          view: { type: string }
                          current_period: { type: object, properties: { start: { type: string }, end: { type: string } } }
                          previous_period: { type: object, nullable: true }
                          model: { type: string }
                          source: { type: string, enum: [periodized, dynamic] }
                          freshness: { type: string }
                          freshness_source: { type: string, enum: [dbt_run] }
                          dbt_status: { type: string, enum: [success, failed, missing] }
                          dbt_error: { type: string, nullable: true }
                          attribution_available: { type: boolean }
                          profitability_enabled: { type: boolean }
                          cm_percent: { type: number, nullable: true }
                          ad_spend_percent: { type: number, nullable: true }
                          is_empty: { type: boolean }
                          empty_reason: { type: string, enum: [no_shopify_datasource, no_ad_datasource, no_data_in_period, dbt_pending], nullable: true }
                          sampling: { type: object, nullable: true, properties: { originalCells: { type: integer }, returnedCells: { type: integer }, method: { type: string, enum: [cell-cap] } } }
                          grading_meta: { type: object }
                          envelope_version: { type: integer, enum: [1] }
        "400": { description: "TENANT_CONTEXT_REQUIRED / INVALID_VIEW / INVALID_FORMAT / INVALID_PERIOD / INVALID_MODEL / MODEL_MISMATCH", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "502": { description: CUBE_UNAVAILABLE, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "503": { description: "PREAGG_WARMING — pre-aggregations are still building", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /acquisition/{view}/{entityId}/timeseries:
    get:
      tags: [Acquisition]
      summary: Get daily grade/metric history for one entity
      description: Only campaigns, ad-sets, and creatives have a grade timeseries (pages and channels don't).
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: view
          in: path
          required: true
          schema: { type: string, enum: [campaigns, ad-sets, creatives] }
        - name: entityId
          in: path
          required: true
          description: "campaign_id / ad_set_id / ad_id depending on view."
          schema: { type: string }
        - $ref: "#/components/parameters/PeriodPreset"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - name: model
          in: query
          schema: { type: string, enum: [last_click, first_click, platform] }
        - name: currency
          in: query
          schema: { type: string }
        - name: timezone
          in: query
          schema: { type: string }
        - name: stores
          in: query
          schema: { type: string }
        - name: ad_providers
          in: query
          schema: { type: string }
      responses:
        "200": { description: Daily timeseries, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
        "400": { description: "INVALID_VIEW / INVALID_ENTITY_ID", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

